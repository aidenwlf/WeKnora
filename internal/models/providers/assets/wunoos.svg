  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#9fe4ff" stroke-width="1.5" opacity="0.55"/>
