  <ellipse cx="256" cy="478" rx="122" ry="16" fill="#8ed9f8" opacity="0.22" filter="url(#shadowBlur)"/>

  <circle cx="256" cy="256" r="210" fill="url(#sphere)" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="256" cy="256" r="210" fill="url(#sphereShade)"/>

  <g clip-path="url(#sphereClip)">
    <path d="M-20 310 C70 246 148 238 232 292 C314 346 388 355 540 278 L540 540 L-20 540 Z"
