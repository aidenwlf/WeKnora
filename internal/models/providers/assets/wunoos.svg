      <stop offset="0.78" stop-color="#ddf4ff"/>
      <stop offset="1" stop-color="#b9e6fb"/>
    </radialGradient>
    <radialGradient id="sphereShade" cx="62%" cy="78%" r="64%">
      <stop offset="0" stop-color="#6fd7ff" stop-opacity="0.26"/>
      <stop offset="0.7" stop-color="#6fd7ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6fd7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0.1" x2="1" y2="0.8">
      <stop offset="0" stop-color="#075cff"/>
      <stop offset="0.3" stop-color="#0a83ff"/>
      <stop offset="0.58" stop-color="#33c9ff"/>
      <stop offset="0.78" stop-color="#b9f6ff"/>
      <stop offset="1" stop-color="#43b9ff"/>
    </linearGradient>
    <linearGradient id="lowerWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f3ff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#8de6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b7f4ff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
